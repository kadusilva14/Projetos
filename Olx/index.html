<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLX - Leitor de QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">OLX Hype</a>
            <a href="cadastrar.html" class="btn btn-success">+ Anunciar grátis</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">

            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center">
                        <h5 class="card-title mb-3">Escanear QR Code do Item</h5>
                        <div id="leitor-qr" class="mx-auto" style="width: 100%; max-width: 300px;"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div id="card-produto" class="card shadow-sm border-0 d-none">
                    <img id="prod-imagem" src="" class="card-img-top" alt="Imagem do Produto" style="max-height: 250px; object-fit: cover;">
                    <div class="card-body">
                        <span id="prod-categoria" class="badge bg-primary mb-2"></span>
                        <span id="prod-estado" class="badge bg-secondary mb-2"></span>
                        <h4 id="prod-nome" class="card-title fw-bold"></h4>
                        <h3 id="prod-preco" class="text-success fw-bold my-3"></h3>
                        <p id="prod-info" class="card-text text-muted"></p>
                    </div>
                </div>

                <div id="msg-aguardando" class="alert alert-info text-center">
                    Aponte a câmera para o QR Code de um produto para ver os detalhes.
                </div>
            </div>

        </div>
    </div>

    <script>
        const cardProduto = document.getElementById('card-produto');
        const msgAguardando = document.getElementById('msg-aguardando');

        function buscarProduto(codigoLido) {
            fetch(`buscar_produto.php?codigo=${encodeURIComponent(codigoLido)}`)
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados.sucesso && dados.dados) {
                        const item = dados.dados;
                        const preco = parseFloat(item.preco_item);

                        document.getElementById('prod-nome').innerText = item.nome || '';
                        document.getElementById('prod-preco').innerText = 'R$ ' + (isNaN(preco) ? '0,00' : preco.toFixed(2));
                        document.getElementById('prod-info').innerText = item.info_item || '';
                        document.getElementById('prod-categoria').innerText = item.categoria || '';
                        document.getElementById('prod-estado').innerText = item.estado_de_conservacao || '';
                        document.getElementById('prod-imagem').src = item.imagem || '';

                        cardProduto.classList.remove('d-none');
                        msgAguardando.classList.add('d-none');
                    } else {
                        cardProduto.classList.add('d-none');
                        msgAguardando.classList.remove('d-none');
                        alert("Atenção: " + (dados.erro || 'Produto não encontrado.'));
                    }
                })
                .catch(erro => console.error("Erro na requisição:", erro));
        }

        function aoDetectarQRCode(codigoTexto) {
            console.log("QR Code detectado:", codigoTexto);
            buscarProduto(codigoTexto);
        }

        const scanner = new Html5QrcodeScanner("leitor-qr", { fps: 10, qrbox: 250 });
        scanner.render(aoDetectarQRCode);
    </script>
</body>
</html>
