<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        
        
        <div class="card mb-4 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-0" id="clima-cidade">Carregando clima...</h5>
                    <small class="text-muted" id="clima-desc">--</small>
                </div>
                <h2 class="mb-0" id="clima-temp">--°C</h2>
            </div>
        </div>

        
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Minhas Tarefas</h4>
            </div>
            <div class="card-body">
                
                <form id="form-tarefa" class="row g-2 mb-3">
                    <div class="col-7">
                        <input type="text" id="novo-titulo" class="form-control" placeholder="Título da tarefa" required>
                    </div>
                    <div class="col-3">
                        <select id="novo-status" class="form-select">
                            <option value="pendente">Pendente</option>
                            <option value="em_andamento">Em andamento</option>
                            <option value="concluido">Concluído</option>
                        </select>
                    </div>
                    <div class="col-2">
                        <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                    </div>
                </form>

                <ul class="list-group" id="lista-tarefas">
                    
                </ul>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
